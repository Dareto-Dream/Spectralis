name: CI

# Checks on every pull request and on pushes to the long-lived branches. Each job only runs when
# its part of the repo changed, so a copy fix on the site does not wait on the .NET tests.

on:
  workflow_call:
  pull_request:
  push:
    branches: [main, staging, dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  changes:
    name: What changed
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.filter.outputs.app }}
      site: ${{ steps.filter.outputs.site }}
      backend: ${{ steps.filter.outputs.backend }}
      tools: ${{ steps.filter.outputs.tools }}
      bot: ${{ steps.filter.outputs.bot }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Filter
        id: filter
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            files=$(git ls-files)   # new branch or force push: check everything
          else
            files=$(git diff --name-only "$BASE" HEAD)
          fi
          hit() { grep -qE "$1" <<< "$files" && echo true || echo false; }
          {
            echo "app=$(hit '^(Spectralis\.(App|Core|Tests|Installer)/|tools/performance/|Assets/|wgpu-host/|Directory\.Build\.|global\.json|Spectralis\.sln|legal\.html|docs/legal/|ffmpeg$|ffmpeg\.exe$|yt-dlp$|yt-dlp\.exe$|\.config/dotnet-tools\.json$|\.github/workflows/)')"
            echo "site=$(hit '^(frontend/|\.github/workflows/)')"
            echo "backend=$(hit '^(backend/|web-share/|\.github/workflows/)')"
            echo "tools=$(hit '^(tools/(r2|release-pipeline)/|\.github/workflows/)')"
            echo "bot=$(hit '^(discord-bot/|backend/|\.github/workflows/)')"
          } >> "$GITHUB_OUTPUT"

  app:
    name: App tests
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-windows-

      - name: Test
        # Performance benchmarks assert frame rates, which a shared runner can't promise. They
        # stay a local check; everything else gates the merge.
        run: dotnet test Spectralis.Tests/Spectralis.Tests.csproj -c Release --filter "FullyQualifiedName!~Spectralis.Tests.Performance&Category!=Performance" --logger "trx;LogFileName=tests.trx"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-results
          path: '**/tests.trx'
          retention-days: 7

  macos:
    name: macOS tests (${{ matrix.rid }})
    needs: changes
    if: needs.changes.outputs.app == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            arch: x64
            runner: macos-15-intel
            minimum: '12.0'
          - rid: osx-arm64
            arch: arm64
            runner: macos-15
            minimum: '13.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ matrix.arch }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-macos-${{ matrix.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wgpu-host/target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('wgpu-host/Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.arch }}-
      - name: Fetch native media helpers
        run: bash Spectralis.Installer/Mac/fetch-helpers.sh "${{ matrix.rid }}"
      - name: Build native visualizer before project evaluation
        run: cargo build --release --manifest-path wgpu-host/Cargo.toml
      - name: Test
        run: dotnet test Spectralis.Tests/Spectralis.Tests.csproj -c Release --filter "FullyQualifiedName!~Spectralis.Tests.Performance&Category!=Performance" --logger "trx;LogFileName=macos-tests.trx"
      - name: Measure native audio analysis and snapshot allocation
        run: dotnet run --project tools/performance/Spectralis.AnalysisProbe.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results-${{ matrix.rid }}
          path: '**/macos-tests.trx'
          retention-days: 7

  site:
    name: Website
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  backend:
    name: Backend
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            backend/target
          key: cargo-backend-${{ hashFiles('backend/Cargo.lock') }}
          restore-keys: cargo-backend-

      - run: cargo test --locked

  bot:
    name: Discord bot
    needs: changes
    if: needs.changes.outputs.bot == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: discord-bot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: discord-bot/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test

  tools:
    name: Release tooling
    needs: changes
    if: needs.changes.outputs.tools == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Release rules
        working-directory: tools/release-pipeline
        run: npm test

      - name: CDN budget rules
        working-directory: tools/r2
        run: |
          npm ci --silent
          npm test
