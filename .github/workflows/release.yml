name: Release

# Merging a pull request into main ships it. The pull request description is the changelog.
#
#   - The version is the next patch after the newest release. Label the pull request
#     release:minor or release:major for a bigger bump, or start its title with a version
#     ("v8.0.0: new engine") to name it outright.
#   - A merge that touches nothing inside the app (site copy, docs, backend) does not cut a
#     release. Label it skip-release to hold one back on purpose.
#   - Run it by hand from the Actions tab to release the current main regardless.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release (leave empty for the next patch)
        required: false
        type: string

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    name: Checks
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
      title: ${{ steps.plan.outputs.title }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Decide
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_VERSION: ${{ inputs.version }}
          EVENT: ${{ github.event_name }}
        run: |
          args=()
          if [ -n "$INPUT_VERSION" ]; then args+=(--version "${INPUT_VERSION#v}"); fi
          if [ "$EVENT" = "workflow_dispatch" ]; then args+=(--force true); fi
          node tools/release-pipeline/cli.mjs plan-stable "${args[@]}"

      - name: Check publishing credentials
        if: steps.plan.outputs.release == 'true'
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          SPECTRALIS_ADMIN_TOKEN: ${{ secrets.SPECTRALIS_ADMIN_TOKEN }}
        run: |
          missing=0
          for key in R2_ACCOUNT_ID R2_ACCESS_KEY_ID R2_SECRET_ACCESS_KEY SPECTRALIS_ADMIN_TOKEN; do
            if [ -z "${!key}" ]; then echo "::error::Missing Actions secret: $key"; missing=1; fi
          done
          exit "$missing"

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: Build
    needs: [plan, validate]
    if: needs.plan.outputs.release == 'true'
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      seed-previous: true
    secrets:
      SPECTRALIS_SPOTIFY_CLIENT_ID: ${{ secrets.SPECTRALIS_SPOTIFY_CLIENT_ID }}
      SPECTRALIS_DISCORD_CLIENT_ID: ${{ secrets.SPECTRALIS_DISCORD_CLIENT_ID }}

  publish:
    name: Publish
    needs: [plan, build]
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      channel: stable
      title: ${{ needs.plan.outputs.title }}
      notes-artifact: release-notes
    secrets: inherit
