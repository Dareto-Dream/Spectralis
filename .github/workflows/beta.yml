name: Beta

# Every push to staging that changes the app becomes a beta build: the next patch version with a
# -beta.<n> suffix, published as a GitHub pre-release and listed in the release index. People who
# picked the Beta channel in Settings get it on their next update check; nobody else does.
# Betas never go to the R2 CDN, and only the newest few are kept.

on:
  push:
    branches: [staging]
    paths:
      - Spectralis.App/**
      - Spectralis.Core/**
      - Spectralis.Installer/**
      - Assets/**
      - wgpu-host/**
      - Directory.Build.props
      - Directory.Build.targets
      - global.json
      - .config/dotnet-tools.json
      - legal.html
      - docs/legal/**
      - ffmpeg
      - ffmpeg.exe
      - yt-dlp
      - yt-dlp.exe
  workflow_dispatch:
    inputs:
      staging-preview:
        description: Build staging-only preview artifacts without publishing any release
        type: boolean
        default: false

concurrency:
  group: ${{ inputs.staging-preview && 'staging-preview' || 'beta' }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  validate:
    name: Checks
    uses: ./.github/workflows/ci.yml

  plan:
    name: Plan
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check publishing credentials
        if: ${{ !inputs.staging-preview }}
        env:
          SPECTRALIS_ADMIN_TOKEN: ${{ secrets.SPECTRALIS_ADMIN_TOKEN }}
        run: |
          if [ -z "$SPECTRALIS_ADMIN_TOKEN" ]; then
            echo "::error::Missing Actions secret: SPECTRALIS_ADMIN_TOKEN"
            exit 1
          fi

      - name: Decide
        id: plan
        env:
          STAGING_PREVIEW: ${{ inputs.staging-preview }}
        run: |
          if [ "$STAGING_PREVIEW" = "true" ]; then
            node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { appendFileSync, writeFileSync } from 'node:fs';
          const versions = execFileSync('git', ['tag', '--list'], {encoding:'utf8'}).split('\n')
            .map(t => /^v(\d+)\.(\d+)\.(\d+)$/.exec(t)).filter(Boolean).map(m => m.slice(1).map(Number))
            .sort((a,b) => b[0]-a[0] || b[1]-a[1] || b[2]-a[2]);
          const [major,minor,patch] = versions[0] ?? [0,0,0];
          const version = `${major}.${minor}.${patch+1}-staging.${process.env.GITHUB_RUN_NUMBER}`;
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          writeFileSync('release-notes.md', 'Staging preview only. No release feeds are changed.\n');
          JS
          else
            node tools/release-pipeline/cli.mjs plan-beta --build "$GITHUB_RUN_NUMBER"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: release-notes.md
          retention-days: 7

  build:
    name: Build
    needs: [plan, validate]
    uses: ./.github/workflows/build-app.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      build-environment: ${{ inputs.staging-preview && 'staging' || 'production' }}
    secrets:
      SPECTRALIS_SPOTIFY_CLIENT_ID: ${{ secrets.SPECTRALIS_SPOTIFY_CLIENT_ID }}
      SPECTRALIS_DISCORD_CLIENT_ID: ${{ secrets.SPECTRALIS_DISCORD_CLIENT_ID }}

  publish:
    if: ${{ !inputs.staging-preview }}
    name: Publish
    needs: [plan, build]
    uses: ./.github/workflows/publish-release.yml
    with:
      version: ${{ needs.plan.outputs.version }}
      channel: beta
      notes-artifact: release-notes
    secrets: inherit
