name: Build app

# Builds Windows, Linux, Intel Mac and Apple Silicon packages for the stable and beta release workflows.

on:
  workflow_call:
    inputs:
      version:
        description: Version to stamp into the build (7.1.1 or 7.1.1-beta.4)
        required: true
        type: string
      seed-previous:
        description: Download the current stable release first so Velopack can build a delta against it
        required: false
        type: boolean
        default: false
      build-environment:
        description: Backend target for an isolated staging preview
        required: false
        type: string
        default: production
    secrets:
      SPECTRALIS_SPOTIFY_CLIENT_ID:
        required: true
      SPECTRALIS_DISCORD_CLIENT_ID:
        required: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CDN_BASE: https://spectralis-cdn.deltavdevs.com
  SPECTRALIS_BUILD_ENVIRONMENT: ${{ inputs.build-environment }}

jobs:
  windows:
    name: Windows (win-x64)
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      SPECTRALIS_SPOTIFY_CLIENT_ID: ${{ secrets.SPECTRALIS_SPOTIFY_CLIENT_ID }}
      SPECTRALIS_DISCORD_CLIENT_ID: ${{ secrets.SPECTRALIS_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-windows-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-windows-

      - name: Restore tools
        run: dotnet tool restore

      - name: Verify staging isolation
        if: inputs.build-environment == 'staging'
        run: dotnet test Spectralis.Tests/Spectralis.Tests.csproj -c Release --filter FullyQualifiedName~StagingBuildTests

      # Without the previous full package in the output folder vpk has nothing to diff against and
      # ships a full download only. Never fatal: a missing delta just means a bigger update.
      - name: Fetch previous release for delta
        if: inputs.seed-previous
        continue-on-error: true
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path releases-velopack | Out-Null
          $env:DOTNET_ROLL_FORWARD = "LatestMajor"
          dotnet vpk download http --url $env:CDN_BASE --channel win-x64 -o releases-velopack

      - name: Build
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: ./Spectralis.Installer/Windows/build-velopack.ps1 -Version $env:VERSION -Channel win-x64

      - name: Collect this version's files
        shell: pwsh
        env:
          VERSION: ${{ inputs.version }}
        run: |
          $v = $env:VERSION
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item output/updater/win-x64/UpdateSpectralis.exe dist/UpdateSpectralis-win-x64.exe
          $names = @(
            "releases.win-x64.json", "assets.win-x64.json", "RELEASES-win-x64",
            "Spectralis-$v-win-x64-full.nupkg", "Spectralis-$v-win-x64-delta.nupkg",
            "Spectralis-win-x64-Setup.exe", "Spectralis-win-x64-Portable.zip"
          )
          foreach ($name in $names) {
            $path = Join-Path releases-velopack $name
            if (Test-Path $path) { Copy-Item $path dist/ }
          }
          foreach ($required in @("releases.win-x64.json", "Spectralis-$v-win-x64-full.nupkg", "Spectralis-win-x64-Setup.exe")) {
            if (-not (Test-Path (Join-Path dist $required))) { throw "Build did not produce $required" }
          }
          Get-ChildItem dist | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: release-win-x64
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  macos:
    name: macOS (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: osx-x64
            arch: x64
            runner: macos-15-intel
            minimum: '12.0'
          - rid: osx-arm64
            arch: arm64
            runner: macos-15
            minimum: '13.0'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      SPECTRALIS_SPOTIFY_CLIENT_ID: ${{ secrets.SPECTRALIS_SPOTIFY_CLIENT_ID }}
      SPECTRALIS_DISCORD_CLIENT_ID: ${{ secrets.SPECTRALIS_DISCORD_CLIENT_ID }}
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.minimum }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-macos-${{ matrix.arch }}-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-macos-${{ matrix.arch }}-
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wgpu-host/target
          key: cargo-macos-${{ matrix.arch }}-${{ hashFiles('wgpu-host/Cargo.lock') }}
          restore-keys: cargo-macos-${{ matrix.arch }}-
      - name: Restore tools
        run: dotnet tool restore
      - name: Fetch previous release for delta
        if: inputs.seed-previous
        continue-on-error: true
        run: |
          mkdir -p releases-velopack
          DOTNET_ROLL_FORWARD=LatestMajor dotnet vpk download http --url "$CDN_BASE" --channel ${{ matrix.rid }} -o releases-velopack
      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: bash Spectralis.Installer/Mac/build-velopack.sh "$VERSION" "${{ matrix.rid }}"
      - name: Check and collect macOS packages
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          mkdir -p dist
          cp output/updater/${{ matrix.rid }}/UpdateSpectralis dist/UpdateSpectralis-${{ matrix.rid }}
          for name in releases.${{ matrix.rid }}.json assets.${{ matrix.rid }}.json RELEASES-${{ matrix.rid }} \
                      "Spectralis-$v-${{ matrix.rid }}-full.nupkg" "Spectralis-$v-${{ matrix.rid }}-delta.nupkg" \
                      Spectralis-${{ matrix.rid }}-Setup.pkg Spectralis-${{ matrix.rid }}-Portable.zip; do
            if [ -f "releases-velopack/$name" ]; then cp "releases-velopack/$name" dist/; fi
          done
          for name in releases.${{ matrix.rid }}.json "Spectralis-$v-${{ matrix.rid }}-full.nupkg" Spectralis-${{ matrix.rid }}-Setup.pkg; do
            test -f "dist/$name" || { echo "::error::Missing $name"; exit 1; }
          done
          pkgutil --expand-full dist/Spectralis-${{ matrix.rid }}-Setup.pkg output/macos-package-check
          find output/macos-package-check -path '*/Updater/UpdateSpectralis' -print -quit | grep -q .
          find output/macos-package-check -name libcef.dylib -print -quit | grep -q .
          python3 Spectralis.Installer/verify-unix-metadata.py macos output/macos-package-check \
            --version "$VERSION" --expected-icon output/app-metadata/macos/Spectralis.icns --rid "${{ matrix.rid }}"
          rm -rf output/macos-package-check
          unzip -q dist/Spectralis-${{ matrix.rid }}-Portable.zip -d output/macos-portable-check
          python3 Spectralis.Installer/verify-unix-metadata.py macos output/macos-portable-check \
            --version "$VERSION" --expected-icon output/app-metadata/macos/Spectralis.icns --rid "${{ matrix.rid }}"
          echo "::notice::macOS packages are unsigned unless signing identities are supplied to the packaging script."
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.rid }}
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error

  linux:
    name: Linux (linux-x64)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SPECTRALIS_SPOTIFY_CLIENT_ID: ${{ secrets.SPECTRALIS_SPOTIFY_CLIENT_ID }}
      SPECTRALIS_DISCORD_CLIENT_ID: ${{ secrets.SPECTRALIS_DISCORD_CLIENT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-linux-${{ hashFiles('**/*.csproj', '.config/dotnet-tools.json') }}
          restore-keys: nuget-linux-

      - name: Restore tools
        run: dotnet tool restore

      - name: Fetch previous release for delta
        if: inputs.seed-previous
        continue-on-error: true
        run: |
          mkdir -p releases-velopack
          DOTNET_ROLL_FORWARD=LatestMajor dotnet vpk download http --url "$CDN_BASE" --channel linux-x64 -o releases-velopack

      - name: Build
        env:
          VERSION: ${{ inputs.version }}
        run: |
          chmod +x Spectralis.Installer/Linux/build-velopack.sh yt-dlp ffmpeg
          ./Spectralis.Installer/Linux/build-velopack.sh "$VERSION"

      - name: Collect this version's files
        env:
          VERSION: ${{ inputs.version }}
        run: |
          v="$VERSION"
          mkdir -p dist
          cp output/updater/linux-x64/UpdateSpectralis dist/UpdateSpectralis-linux-x64
          for name in releases.linux-x64.json assets.linux-x64.json RELEASES-linux-x64 \
                      "Spectralis-$v-linux-x64-full.nupkg" "Spectralis-$v-linux-x64-delta.nupkg" \
                      Spectralis-linux-x64.AppImage; do
            if [ -f "releases-velopack/$name" ]; then cp "releases-velopack/$name" dist/; fi
          done
          for required in releases.linux-x64.json "Spectralis-$v-linux-x64-full.nupkg" Spectralis-linux-x64.AppImage; do
            [ -f "dist/$required" ] || { echo "::error::Build did not produce $required"; exit 1; }
          done
          ls -la dist

      - name: Check Linux app identity and icon
        env:
          VERSION: ${{ inputs.version }}
        run: |
          mkdir -p output/linux-package-check
          chmod +x dist/Spectralis-linux-x64.AppImage
          (cd output/linux-package-check && ../../dist/Spectralis-linux-x64.AppImage --appimage-extract > /dev/null)
          python3 Spectralis.Installer/verify-unix-metadata.py linux output/linux-package-check/squashfs-root \
            --version "$VERSION" --expected-icon Assets/icon.png

      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-x64
          path: dist/
          retention-days: 7
          compression-level: 0
          if-no-files-found: error
